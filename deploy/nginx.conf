# FreeLLMAPI 的 Nginx 反代配置
# 放在 /etc/nginx/sites-available/freellmapi，然后 ln -s 到 sites-enabled
# 把两处 your-domain.com 换成你自己的域名

# HTTP：先做 ACME 校验，其余全部跳 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Let's Encrypt 校验
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    # certbot 会自动填入这两行
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 上传体积（图片/音频/视频生成可能带较大 body）
    client_max_body_size 25m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 可选：只允许你自己的 IP 访问管理面板（强烈建议开启）
    # allow 1.2.3.4;      # 换成你的公网 IP
    # deny all;

    # 可选：再加一层 Basic Auth（域名暴露时多一道保险）
    # auth_basic "FreeLLMAPI";
    # auth_basic_user_file /etc/nginx/.freellmapi_htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 流式输出必须关缓冲，否则 SSE 会被攒成一坨再吐出来
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 长连接与超时（模型推理可能较慢）
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    access_log /var/log/nginx/freellmapi.access.log;
    error_log  /var/log/nginx/freellmapi.error.log;
}
